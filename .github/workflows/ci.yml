name: CPU validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-chem.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py --out demo_output
      - run: for script in config/cluster.example.sh slurm/*.slurm; do bash -n "$script"; done
      - run: python -m compileall -q scripts tests
